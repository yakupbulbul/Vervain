name: PureMac
options:
  bundleIdPrefix: com.yakupbulbul
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  PureMac:
    type: application
    platform: macOS
    sources:
      - path: PureMac
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupbulbul.PureMac
        INFOPLIST_FILE: PureMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: PureMac/PureMac.entitlements
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        OTHER_CODE_SIGN_FLAGS: "--deep"

  PureMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PureMacTests
    dependencies:
      - target: PureMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupbulbul.PureMacTests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_STRICT_CONCURRENCY: complete
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PureMac.app/Contents/MacOS/PureMac"
        GENERATE_INFOPLIST_FILE: YES

  PureMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: PureMacUITests
    dependencies:
      - target: PureMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupbulbul.PureMacUITests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PureMac

schemes:
  PureMac:
    build:
      targets:
        PureMac: all
        PureMacTests: [test]
        PureMacUITests: [test]
    test:
      targets:
        - PureMacTests
        - PureMacUITests
