name: Vervain
options:
  bundleIdPrefix: com.yakupbulbul
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  Vervain:
    type: application
    platform: macOS
    sources:
      - path: Vervain
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupbulbul.Vervain
        INFOPLIST_FILE: Vervain/Info.plist
        CODE_SIGN_ENTITLEMENTS: Vervain/Vervain.entitlements
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        OTHER_CODE_SIGN_FLAGS: "--deep"

  VervainTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VervainTests
    dependencies:
      - target: Vervain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupbulbul.VervainTests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_STRICT_CONCURRENCY: complete
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vervain.app/Contents/MacOS/Vervain"
        GENERATE_INFOPLIST_FILE: YES

  VervainUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: VervainUITests
    dependencies:
      - target: Vervain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupbulbul.VervainUITests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Vervain

schemes:
  Vervain:
    build:
      targets:
        Vervain: all
        VervainTests: [test]
        VervainUITests: [test]
    test:
      targets:
        - VervainTests
        - VervainUITests
