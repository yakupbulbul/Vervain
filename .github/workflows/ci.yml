name: CI

on:
  push:
    branches: [main, "v2/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project and verify it is up to date
        run: |
          xcodegen generate
          git diff --exit-code -- Vervain.xcodeproj/project.pbxproj \
            || { echo "::error::Vervain.xcodeproj is out of sync with project.yml. Run 'xcodegen generate' and commit."; exit 1; }

      - name: Unit tests
        run: |
          xcodebuild test \
            -project Vervain.xcodeproj \
            -scheme Vervain \
            -destination 'platform=macOS' \
            -only-testing:VervainTests \
            CODE_SIGNING_ALLOWED=NO
