name: Strings report

# Exports Xcode's view of every localizable string and prints the ones that
# lack a translation. Runs when this file changes, or by hand from the
# Actions tab once it exists on the default branch.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/strings-report.yml"
      - "scripts/untranslated.py"

permissions:
  contents: read

jobs:
  report:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Export localizations
        run: |
          xcodebuild -exportLocalizations \
            -project Vervain.xcodeproj \
            -localizationPath build/loc \
            -exportLanguage tr -exportLanguage de -exportLanguage es \
            -exportLanguage fr -exportLanguage zh-Hans \
            CODE_SIGNING_ALLOWED=NO

      - name: List untranslated strings
        run: python3 scripts/untranslated.py build/loc || true
